<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Валентинка для Аделины 💖</title>

<style>
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: "Arial", sans-serif;
    text-align: center;
    color: #4a004a;
}

.container {
    margin-top: 50px;
}

h1 {
    font-size: 40px;
}

#heart {
    font-size: 120px;
    cursor: pointer;
    transition: transform 0.3s;
}

#heart:hover {
    transform: scale(1.2);
}

#message {
    display: none;
    font-size: 22px;
    margin-top: 20px;
}

.game-box {
    margin-top: 30px;
    padding: 20px;
    background: white;
    width: 60%;
    margin-left: auto;
    margin-right: auto;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

button {
    background: #ff4f81;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #ff1f61;
}

#result {
    font-size: 20px;
    margin-top: 15px;
}
</style>

<script>
function openHeart() {
    document.getElementById("message").style.display = "block";
}

function checkLove(answer) {
    let result = document.getElementById("result");

    if(answer === "yes") {
        result.innerHTML = "💖 Я тоже тебя обожаю Аделина! 💖";
    } else {
        result.innerHTML = "😿 Невозможно! Ты просто стесняешься — я всё равно тебя люблю!";
    }
}
</script>

</head>

<body>

<div class="container">

<h1>💘 Электронная валентинка для Аделины 💘</h1>

<p>Нажми на сердечко 🐾</p>

<div id="heart" onclick="openHeart()">❤️</div>

<div id="message">
<p>
Аделина, ты для меня особенная.  
Ты тёплая, милая и невероятная — как самый редкий алмаз в мире.  
Я ценю тебя, думаю о тебе и хочу, чтобы ты всегда улыбалась.    
</p>
</div>

<div class="game-box">
<h2>Мини-игра «Проверка любви» 💌</h2>
<p>Аделина, ты меня любишь?</p>

<button onclick="checkLove('yes')">Да 💕</button>
<button onclick="checkLove('no')">Нет 😢</button>

<div id="result"></div>
</div>

</div>

</body>
</html>
