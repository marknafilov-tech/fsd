<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Music Player</title>

<style>
:root{
  --bg:#0e0f13;
  --card:#161821;
  --text:#eaeaf0;
  --muted:#8b8f9c;
  --accent:#5b7cfa;
  --radius:14px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:1100px;
  margin:auto;
  padding:16px;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:16px;
}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
}

/* SIDEBAR */
.sidebar{
  background:var(--card);
  border-radius:var(--radius);
  padding:14px;
}
.sidebar h2{
  margin:8px 0;
  font-size:14px;
  color:var(--muted);
}
.sidebar button{
  width:100%;
  background:none;
  border:none;
  color:var(--text);
  text-align:left;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
}
.sidebar button:hover{background:#222436}

/* MAIN */
.main{
  background:var(--card);
  border-radius:var(--radius);
  padding:14px;
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#222436;
  color:var(--text);
}

.track{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}
.track:hover{background:#222436}
.track.active{background:#2a2d40}

.cover{
  width:48px;
  height:48px;
  border-radius:8px;
  background:#333;
  object-fit:cover;
}
.track-info{
  flex:1;
}
.track-info b{display:block}
.track-info span{
  font-size:12px;
  color:var(--muted);
}

.code{
  font-size:11px;
  color:var(--accent);
}

.controls{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#10121a;
  border-top:1px solid #222;
  padding:10px;
  display:flex;
  align-items:center;
  gap:12px;
}

.controls button{
  background:none;
  border:none;
  color:var(--text);
  font-size:18px;
  cursor:pointer;
}

.progress{
  flex:1;
}
.progress input{
  width:100%;
}

.editor{
  margin-top:16px;
  padding:12px;
  border-radius:12px;
  background:#10121a;
}
.editor h3{margin-top:0}
.editor input{
  width:100%;
  margin-bottom:6px;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#222436;
  color:var(--text);
}
.editor button{
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}
.local{
  font-size:11px;
  color:#ffb86c;
}
</style>
</head>

<body>

<div class="app">

  <div class="sidebar">
    <h2>Разделы</h2>
    <button onclick="showAll()">Все треки</button>
    <button onclick="showFav()">Избранное</button>
    <button onclick="addLocal()">Загрузить музыку</button>
  </div>

  <div class="main">
    <div class="search">
      <input id="search" placeholder="Поиск по названию или коду">
    </div>

    <div id="list"></div>

    <div class="editor" id="editor" hidden>
      <h3>Редактор трека</h3>
      <input id="eTitle" placeholder="Название">
      <input id="eArtist" placeholder="Исполнитель">
      <input id="eCode" placeholder="Код (4 символа)">
      <input id="eCover" placeholder="URL обложки">
      <button onclick="saveEdit()">Сохранить</button>
    </div>
  </div>

</div>

<div class="controls">
  <button onclick="prev()">⏮</button>
  <button onclick="toggle()">⏯</button>
  <button onclick="next()">⏭</button>
  <div class="progress">
    <input type="range" min="0" max="100" value="0" id="bar">
  </div>
</div>

<audio id="audio"></audio>

<script>
/* ===== DATA ===== */
let tracks = JSON.parse(localStorage.getItem("tracks")) || [
  {
    id:"A1B2",
    title:"Demo Track",
    artist:"Unknown",
    file:"music/track1.mp3",
    cover:"",
    local:false
  }
];

let current = null;
let audio = document.getElementById("audio");

/* ===== RENDER ===== */
function render(list=tracks){
  const box=document.getElementById("list");
  box.innerHTML="";
  list.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="track"+(current===i?" active":"");
    d.onclick=()=>play(i);
    d.innerHTML=`
      <img class="cover" src="${t.cover||''}">
      <div class="track-info">
        <b>${t.title}</b>
        <span>${t.artist}</span>
        <div class="code">${t.id} ${t.local?'<span class="local">LOCAL</span>':''}</div>
      </div>
      <button onclick="event.stopPropagation();edit(${i})">✏️</button>
    `;
    box.appendChild(d);
  });
}

render();

/* ===== PLAYER ===== */
function play(i){
  current=i;
  audio.src=tracks[i].file;
  audio.play();
  render();
}
function toggle(){
  audio.paused?audio.play():audio.pause();
}
function next(){
  play((current+1)%tracks.length);
}
function prev(){
  play((current-1+tracks.length)%tracks.length);
}

/* ===== SEARCH ===== */
search.oninput=()=>{
  const v=search.value.toLowerCase();
  render(tracks.filter(t=>t.title.toLowerCase().includes(v)||t.id.toLowerCase().includes(v)));
};

/* ===== EDITOR ===== */
let editIndex=null;
function edit(i){
  editIndex=i;
  const t=tracks[i];
  editor.hidden=false;
  eTitle.value=t.title;
  eArtist.value=t.artist;
  eCode.value=t.id;
  eCover.value=t.cover;
}
function saveEdit(){
  const t=tracks[editIndex];
  t.title=eTitle.value;
  t.artist=eArtist.value;
  t.id=eCode.value.slice(0,4);
  t.cover=eCover.value;
  localStorage.setItem("tracks",JSON.stringify(tracks));
  editor.hidden=true;
  render();
}

/* ===== LOCAL FILE ===== */
function addLocal(){
  const input=document.createElement("input");
  input.type="file";
  input.accept="audio/*";
  input.onchange=()=>{
    const f=input.files[0];
    tracks.push({
      id:Math.random().toString(36).substring(2,6).toUpperCase(),
      title:f.name,
      artist:"Local",
      file:URL.createObjectURL(f),
      cover:"",
      local:true
    });
    localStorage.setItem("tracks",JSON.stringify(tracks));
    render();
  };
  input.click();
}
</script>

</body>
</html>
